<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admins — Focus Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="name">FOCUS</div>
      <div class="sub">Admin Console</div>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="categories.html">Categories</a>
      <a href="orders.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="coupons.html">Coupons</a>
      <a href="banners.html">Banners</a>
      <a href="cms.html">CMS</a>
      <a href="seo.html">SEO</a>
      <a href="settings.html" id="navSettings">Settings</a>
      <a href="admins.html" id="navAdmins" class="active">Admins</a>
      <a href="auditlog.html" id="navAuditLog">Audit Log</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Admins</h1>
        <div class="sub">Manage who can access this console, and what they can do. Owner access only.</div>
      </div>
      <div class="user">
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-header"><h2>Add Admin</h2></div>
      <div style="display:grid; gap:10px; grid-template-columns: 1fr 1fr;">
        <input type="text" id="newName" placeholder="Name" style="padding:9px; border:1px solid #D1D5DB; border-radius:6px;">
        <input type="email" id="newEmail" placeholder="Email" style="padding:9px; border:1px solid #D1D5DB; border-radius:6px;">
        <input type="password" id="newPassword" placeholder="Temporary password" style="padding:9px; border:1px solid #D1D5DB; border-radius:6px;">
        <select id="newRole" style="padding:9px; border:1px solid #D1D5DB; border-radius:6px;">
          <option value="staff">Staff — view + update order status</option>
          <option value="manager">Manager — manage catalog, orders, marketing</option>
          <option value="owner">Owner — full access incl. admins & settings</option>
        </select>
      </div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="createAdmin()">Add Admin</button>
    </div>

    <div class="panel">
      <table class="data-table" id="adminTable">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody><tr><td colspan="5" class="status">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>applyRoleGating();</script>
<script>
let currentAdminEmail = null;

async function loadAdmins() {
  const tbody = document.querySelector("#adminTable tbody");
  try {
    const me = await adminGet("/admin/me");
    currentAdminEmail = me.email;

    const admins = await adminGet("/admin/admins");
    tbody.innerHTML = admins.map(a => `
      <tr>
        <td>${a.name}</td>
        <td>${a.email}</td>
        <td>
          <select onchange="updateRole(${a.id}, this.value)" ${a.email === currentAdminEmail ? "disabled" : ""}>
            <option value="staff" ${a.role === "staff" ? "selected" : ""}>Staff</option>
            <option value="manager" ${a.role === "manager" ? "selected" : ""}>Manager</option>
            <option value="owner" ${a.role === "owner" ? "selected" : ""}>Owner</option>
          </select>
        </td>
        <td>${a.is_active ? '<span class="pill completed">Active</span>' : '<span class="pill incompleted">Deactivated</span>'}</td>
        <td>
          ${a.email === currentAdminEmail ? "<em style='color:#6B7280; font-size:12px;'>this is you</em>" : `
            <button class="btn" onclick="toggleActive(${a.id}, ${!a.is_active})">${a.is_active ? "Deactivate" : "Activate"}</button>
            <button class="btn btn-danger" onclick="deleteAdmin(${a.id})">Delete</button>
          `}
        </td>
      </tr>`).join("");
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="status">Couldn't load admins — this page requires owner access.</td></tr>`;
  }
}

async function createAdmin() {
  const name = document.getElementById("newName").value.trim();
  const email = document.getElementById("newEmail").value.trim();
  const password = document.getElementById("newPassword").value;
  const role = document.getElementById("newRole").value;
  if (!name || !email || !password) { alert("Fill in all fields."); return; }
  try {
    await adminSend("/admin/admins", "POST", { name, email, password, role });
    ["newName","newEmail","newPassword"].forEach(id => document.getElementById(id).value = "");
    loadAdmins();
  } catch (e) {
    alert("Couldn't create admin — email may already be in use.");
  }
}

async function updateRole(id, role) {
  await adminSend(`/admin/admins/${id}`, "PUT", { role });
  loadAdmins();
}

async function toggleActive(id, activate) {
  await adminSend(`/admin/admins/${id}`, "PUT", { is_active: activate });
  loadAdmins();
}

async function deleteAdmin(id) {
  if (!confirm("Delete this admin account? This can't be undone.")) return;
  try {
    await adminSend(`/admin/admins/${id}`, "DELETE");
    loadAdmins();
  } catch (e) {
    alert("Couldn't delete this admin.");
  }
}

loadAdmins();
</script>
</body>
</html>
