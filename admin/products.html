<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Focus Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="name">FOCUS</div>
      <div class="sub">Admin Console</div>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="categories.html">Categories</a>
      <a href="orders.html">Orders</a>
      <a href="customers.html">Customers</a>
      <a href="coupons.html">Coupons</a>
      <a href="banners.html">Banners</a>
      <a href="cms.html">CMS</a>
      <a href="seo.html">SEO</a>
      <a href="settings.html" id="navSettings">Settings</a>
      <a href="admins.html" id="navAdmins">Admins</a>
      <a href="auditlog.html" id="navAuditLog">Audit Log</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Products</h1>
        <div class="sub">Manage your catalog.</div>
      </div>
      <div class="user">
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="panel">
      <table class="data-table" id="productTable">
        <thead>
          <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Badge</th><th></th></tr>
        </thead>
        <tbody><tr><td colspan="6" class="status">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>applyRoleGating();</script>
<script>
(async function () {
  const tbody = document.querySelector("#productTable tbody");
  try {
    const products = await adminGet("/admin/products");
    tbody.innerHTML = products.length ? products.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>${p.category_id ?? "—"}</td>
        <td>${formatPrice(p.price)}</td>
        <td>${p.stock}</td>
        <td>${p.badge || "—"}</td>
        <td><button class="btn btn-danger" onclick="deleteProduct(${p.id})">Delete</button></td>
      </tr>`).join("") : `<tr><td colspan="6" class="status">No products yet.</td></tr>`;
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6" class="status">Couldn't load products.</td></tr>`;
  }
})();

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;
  await adminSend(`/admin/products/${id}`, "DELETE");
  window.location.reload();
}
</script>
</body>
</html>
