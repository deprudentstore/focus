<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Arrivals — Focus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">FOCUS</div>
  <nav class="main-nav">
    <a href="shop.html">New Arrivals</a>
    <a href="shop.html?category=necklaces">Jewellery</a>
    <a href="shop.html">Collections</a>
    <a href="shop.html">Occasions</a>
    <a href="shop.html?badge=BESTSELLER">Best Sellers</a>
  </nav>
  <div class="header-icons">
    <span>🔍</span><a href="wishlist.html">♡</a><span>👜</span>
  </div>
</header>

<section class="section">
  <div class="section-header">
    <h2 id="pageTitle">New Arrivals</h2>
    <a href="index.html" class="link-more">Shop All →</a>
  </div>
  <div class="grid" id="productGrid">
    <div class="status">Loading products…</div>
  </div>
</section>

<footer class="site-footer" id="siteFooter">© 2026 Focus. Developed by De Prudent Store Designer.</footer>

<script src="js/config.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/api.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const category = params.get("category");
  const badge = params.get("badge");
  const grid = document.getElementById("productGrid");
  if (category) {
    document.getElementById("pageTitle").textContent =
      category.charAt(0).toUpperCase() + category.slice(1);
  } else if (badge) {
    document.getElementById("pageTitle").textContent = "Best Sellers";
  }
  try {
    const qs = new URLSearchParams();
    if (category) qs.set("category", category);
    if (badge) qs.set("badge", badge);
    const path = qs.toString() ? `/products?${qs.toString()}` : "/products";
    const products = await apiGet(path);
    grid.innerHTML = products.length
      ? products.map(productCardHTML).join("")
      : `<div class="status">No products found.</div>`;
  } catch (e) {
    grid.innerHTML = `<div class="status">Couldn't load products. Is the backend running?</div>`;
  }
})();
</script>
<script>
(async function () {
  try {
    const footerContent = await apiGet("/content/cms_footer_text");
    if (footerContent.value) document.getElementById("siteFooter").textContent = footerContent.value;
  } catch (e) {}
})();
</script>
</body>
</html>
